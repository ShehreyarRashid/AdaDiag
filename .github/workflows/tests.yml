# Runs the test suite on every push and pull request, so the README badge and the
# "Actions" tab show whether the committed code passes on a fresh machine.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only PyTorch first: the default PyPI wheel bundles CUDA (several GB) that the
      # tests never use. requirements.txt then sees torch already satisfied.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify bundled data checksums
        run: cd data && sha256sum -c --quiet SHA256SUMS

      - name: Run tests
        run: python -m pytest tests/ -q
