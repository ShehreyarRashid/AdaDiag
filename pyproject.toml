[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adadiag"
version = "1.17.0"
description = "Adaptive modality x task weighting for multimodal microservice failure diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shehreyar Rashid"}]
dependencies = ["torch>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/ShehreyarRashid/AdaDiag"
"Base method (TVDiag)" = "https://github.com/WHU-AISE/TVDiag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
